<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The harness browser's fonts (scripts/harness.mjs sets FONTCONFIG_FILE to this file): the machine's own config, then
  system-ui and sans-serif on a Latin font with a real bold face. Paseo's phone layout puts system-ui first, and a
  machine whose default sans is a regular-only font (a CJK fallback such as WenQuanYi Zen Hei) draws every weight
  below 700 regular, since fontconfig synthesizes bold only from 700: phone renders lost every semibold
  (release-notes-show-their-bold, invariant 120). fontWeightProblem (scripts/font-weights.mjs) checks the result.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test qual="any" name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Liberation Sans</string><string>Arimo</string><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Liberation Sans</string><string>Arimo</string><string>DejaVu Sans</string></edit>
  </match>
</fontconfig>

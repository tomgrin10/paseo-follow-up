name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/changelog.test.ts checks that the notes' image URLs name commits in this branch's history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # npm run verify includes the scale check, which drives a real (isolated) Paseo daemon.
      - run: npm install -g @getpaseo/cli@0.15.2
      - run: npm run verify
      - run: npm pack --dry-run
